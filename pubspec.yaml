name: gym_book_app
description: "Gymmie: gym management for gym owners, managers, staff and trainers (reconstructed from the 1.9.4 APK)."
publish_to: 'none'

# versionName 1.9.4 / versionCode 1178 recovered from the original APK (apktool.yml).
version: 1.9.4+1178

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.3.0
  dio: ^5.11.1
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  cached_network_image: ^4.0.4
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  signature: ^6.4.0
  fl_chart: ^1.2.0
  flutter_contacts: ^2.6.0
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  app_links: ^7.2.2
  audioplayers: ^6.8.1
  in_app_review: ^2.0.12
  path_provider: ^2.1.6
  material_symbols_icons: ^4.2960.0
  zo_animated_border: ^1.1.0
  sentry_flutter: ^9.30.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  collection: ^1.19.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/poster_templates/
    - assets/sound/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
