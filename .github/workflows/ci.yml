name: ci
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

# least privilege: these jobs only read the repository (the signed bundle is uploaded as a workflow artifact, which needs no extra scope)
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd backend && npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.7', cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # A version tag builds the signed Play Store bundle. Secrets: UPLOAD_KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, API_BASE_URL, SITE_URL
  # Missing signing/configuration must fail instead of producing a green release with no app.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - name: Validate release configuration
        env:
          RELEASE_API_URL: ${{ secrets.API_BASE_URL }}
          RELEASE_SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          test "$HAS_KEYSTORE" = "true" || { echo "Release signing is required. See docs/RELEASE.md."; exit 1; }
          node -e 'for (const name of ["RELEASE_API_URL", "RELEASE_SITE_URL"]) { const u = new URL(process.env[name]); if (u.protocol !== "https:" || !u.hostname || u.username || u.password || u.search || u.hash) throw Error(name + " must be a plain HTTPS URL"); }'
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        if: env.HAS_KEYSTORE == 'true'
        with: { channel: stable, flutter-version: '3.47.7', cache: true }
      - name: Signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - if: env.HAS_KEYSTORE == 'true'
        run: flutter pub get
      - if: env.HAS_KEYSTORE == 'true'
        env:
          RELEASE_API_URL: ${{ secrets.API_BASE_URL }}
          RELEASE_SITE_URL: ${{ secrets.SITE_URL }}
          RELEASE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
        run: >-
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          "--dart-define=API_BASE_URL=$RELEASE_API_URL"
          "--dart-define=SITE_URL=$RELEASE_SITE_URL"
          "--dart-define=SENTRY_DSN=$RELEASE_SENTRY_DSN"
          "--dart-define=OPENGYM_SOURCE_URL=$RELEASE_SOURCE_URL"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with: { name: release, path: "build/app/outputs/bundle/release/*.aab\nbuild/symbols" }
