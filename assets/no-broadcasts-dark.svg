<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Radial glow behind megaphone -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B4FD8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Megaphone body gradient -->
    <linearGradient id="megaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F6EF7"/>
      <stop offset="100%" stop-color="#2D4CC8"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" fill="#000000" rx="24"/>

  <!-- Glow circle -->
  <circle cx="120" cy="118" r="90" fill="url(#glow)"/>

  <!-- Subtle outer ring -->
  <circle cx="120" cy="118" r="72" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Inner circle bg -->
  <circle cx="120" cy="118" r="58" fill="#0D0D1A" opacity="0.9"/>

  <!-- ── MEGAPHONE ── -->
  <!-- Handle/grip -->
  <rect x="78" y="109" width="10" height="18" rx="3" fill="#2D4CC8"/>

  <!-- Main horn body -->
  <path d="M88 105 L108 96 L108 130 L88 121 Z" fill="url(#megaGrad)" filter="url(#shadow)"/>

  <!-- Bell flare -->
  <path d="M108 96 L138 82 L138 144 L108 130 Z" fill="url(#megaGrad)" filter="url(#shadow)"/>

  <!-- Horn opening arc -->
  <ellipse cx="138" cy="113" rx="6" ry="31" fill="#3B5EDB"/>

  <!-- Sound waves -->
  <!-- Wave 1 -->
  <path d="M148 100 Q158 113 148 126" fill="none" stroke="#4F6EF7" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Wave 2 -->
  <path d="M154 94 Q168 113 154 132" fill="none" stroke="#4F6EF7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Wave 3 -->
  <path d="M160 88 Q178 113 160 138" fill="none" stroke="#4F6EF7" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Highlight shine on horn -->
  <path d="M110 99 L135 87" stroke="#8AA4FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- ── CHAT CARD BADGE (top right) ── -->
  <g filter="url(#softShadow)">
    <rect x="158" y="38" width="48" height="48" rx="14" fill="#111111" stroke="#2A2A3A" stroke-width="1"/>
    <!-- Chat bubble icon -->
    <rect x="170" y="52" width="24" height="18" rx="5" fill="#4F6EF7"/>
    <path d="M174 70 L171 75 L180 70" fill="#4F6EF7"/>
    <!-- Dots on chat bubble -->
    <circle cx="176" cy="61" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="182" cy="61" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="188" cy="61" r="2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- ── GREEN CHECK BADGE (bottom left) ── -->
  <g filter="url(#softShadow)">
    <circle cx="54" cy="180" r="22" fill="#065F46" stroke="#064E3B" stroke-width="1"/>
    <circle cx="54" cy="180" r="18" fill="#059669"/>
    <!-- Checkmark -->
    <polyline points="44,180 51,187 65,172" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="96" cy="74" r="2.5" fill="#4F6EF7" opacity="0.7"/>
  <circle cx="165" cy="155" r="2" fill="#4F6EF7" opacity="0.5"/>
  <circle cx="72" cy="140" r="1.5" fill="#6B7AFF" opacity="0.5"/>
  <circle cx="170" cy="95" r="1.5" fill="#6B7AFF" opacity="0.4"/>

  <!-- Small star sparkles -->
  <!-- Star 1 -->
  <g transform="translate(88, 68) rotate(20)" opacity="0.6">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Star 2 -->
  <g transform="translate(168, 152) rotate(15)" opacity="0.5">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
