# The member training log (openGym, AGPL-3.0) for Gymmie, in single-sign-on-only mode.
#
#   cp .env.example .env     # set the three secrets, then
#   docker compose up -d --build
#
# Gymmie members never see an openGym login: the Gymmie app posts a short-lived signed assertion to
# /api/sso/redeem (see opengym/api/sso.js). Passkeys, passwords, pairing and guest mode are switched off.
name: gymmie-member-app

services:
  api:
    build:
      context: ./opengym/api
      target: default
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
      - ORIGIN=${MEMBER_APP_ORIGIN:?set MEMBER_APP_ORIGIN, e.g. https://log.example.com}
      - RP_ID=${MEMBER_APP_RP_ID:-localhost}
      # Single sign-on with the Gymmie backend (>= 32 characters, identical to OPENGYM_SSO_SECRET there).
      - GYMMIE_SSO_SECRET=${OPENGYM_SSO_SECRET:?set OPENGYM_SSO_SECRET (32+ characters)}
      - GYMMIE_SSO_ONLY=1
      # A short session: a member who is blocked still loses access within a day even if the revoke call
      # from Gymmie was lost; the app signs in again from the Gymmie session on every launch.
      - SESSION_DAYS=1
      - ALLOW_GUEST=0
      - INVITE_ONLY=0
      - PASSWORD_LOGIN=0
    volumes:
      - ./data:/data      # per-member training logs and the session secret: BACK THIS UP

  web:
    build:
      context: ./opengym
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${MEMBER_APP_PORT:-8080}:${NGINX_PORT:-80}"
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=api
      - PORT=3000
      - RESOLVER=${RESOLVER:-127.0.0.11}
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      - BASE_PATH=
      - MEDIA_UPLOAD_MAX=${MEDIA_UPLOAD_MAX:-48m}
